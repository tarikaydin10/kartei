# Jeder Push auf main: prüfen, bauen, auf den VPS deployen.
#
# Der Deploy ist derselbe wie lokal (`scripts/deploy.mjs`): packen, per scp
# hochladen, Symlink atomar umlegen. Zugangsdaten kommen aus den Repository-
# Secrets (Settings → Secrets and variables → Actions), siehe deploy/README.md:
#
#   DEPLOY_HOST          IP oder Hostname des VPS (kein ssh-config-Alias)
#   DEPLOY_USER          SSH-Benutzer, z. B. deploy
#   DEPLOY_SSH_KEY       privater Schlüssel, dessen .pub beim Benutzer liegt
#   DEPLOY_KNOWN_HOSTS   Ausgabe von `ssh-keyscan <host>` — pinnt den Hostkey
#   DEPLOY_HOST_FINGERPRINT
#                        alternativ zu DEPLOY_KNOWN_HOSTS: der Fingerabdruck
#                        „SHA256:…“ des ed25519-Hostschlüssels, wie ihn
#                        deploy/bootstrap.sh ausgibt. Der Workflow holt den
#                        Schlüssel dann selbst und bricht ab, wenn er nicht passt.
#   DEPLOY_PORT          optional, Standard 22
#   DEPLOY_ROOT          optional, Standard /srv/static/kartei
#
# Solange DEPLOY_HOST fehlt, wird nur geprüft und gebaut, nicht deployt.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nie zwei Deploys gleichzeitig; ein neuerer Push wartet, bricht aber keinen
# laufenden Upload ab.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Deploy überspringen (keine Zugangsdaten)
        if: env.DEPLOY_HOST == ''
        run: echo "::warning::DEPLOY_HOST ist nicht gesetzt — gebaut, aber nicht deployt. Siehe deploy/README.md."

      - name: SSH einrichten
        if: env.DEPLOY_HOST != ''
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST_FINGERPRINT: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::DEPLOY_SSH_KEY muss gesetzt sein."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          elif [ -n "$DEPLOY_HOST_FINGERPRINT" ]; then
            # Schlüssel holen, aber nur mit passendem Fingerabdruck übernehmen —
            # sonst könnte sich jemand dazwischen als Server ausgeben.
            ssh-keyscan -p "$DEPLOY_PORT" -t ed25519 "$DEPLOY_HOST" > /tmp/hostkey 2>/dev/null || true
            actual="$(ssh-keygen -lf /tmp/hostkey 2>/dev/null | awk '{print $2}')"
            expected="$(printf '%s' "$DEPLOY_HOST_FINGERPRINT" | tr -d '[:space:]')"
            if [ -z "$actual" ]; then
              echo "::error::Server $DEPLOY_HOST:$DEPLOY_PORT per SSH nicht erreichbar (Firewall? sshd?)."
              exit 1
            fi
            if [ "$actual" != "$expected" ]; then
              echo "::error::Hostschlüssel passt nicht: erwartet $expected, erhalten $actual. Abgebrochen."
              exit 1
            fi
            mv /tmp/hostkey ~/.ssh/known_hosts
          else
            echo "::error::DEPLOY_KNOWN_HOSTS oder DEPLOY_HOST_FINGERPRINT muss gesetzt sein."
            exit 1
          fi
          cat > ~/.ssh/config <<'EOF'
          Host *
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
          EOF

      - name: Deploy
        if: env.DEPLOY_HOST != ''
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT || '/srv/static/kartei' }}
        run: node scripts/deploy.mjs
